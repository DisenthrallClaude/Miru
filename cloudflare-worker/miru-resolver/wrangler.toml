{
  "name": "miru-resolver",
  "main": "src/worker.js",
  "compatibility_date": "2024-12-01",
  "kv_namespaces": [
    {
      "binding": "RESOLVE_CACHE",
      "id": "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
    }
  ],
  "vars": {
    "CACHE_TTL_SECONDS": "2700",
    "ALLOWED_ORIGINS": "*",
    "DAILY_RESOLVE_BUDGET": "4000",
    "MIN_PER_USER": "30",
    "MAX_PER_USER": "800"
  }
}
