name: emulator-e2e
on:
  workflow_dispatch:
    inputs:
      specs:
        description: '逐源自测清单 规则名|关键词;...'
        required: false
        default: 'FQDM|凡人修仙传;MXdm|凡人修仙传;AGE|凡人修仙传;fcdm|凡人修仙传;7sefun|凡人修仙传;dmghg1|凡人修仙传;blbl|凡人修仙传;lblb|凡人修仙传'
  push:
    branches: [v2-overhaul]
    paths: ['lib/**', 'assets/plugins/**', 'android/**', 'pubspec.*', '.github/workflows/emulator-e2e.yaml', 'tool/ci_emulator_e2e.sh']
concurrency:
  group: emulator-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.0', channel: stable, cache: true }
      - name: Build x86_64 autotest APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64 -Pmiru.abis=x86_64 --dart-define=MIRU_AUTOTEST='FQDM|凡人修仙传'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SPECS: ${{ github.event.inputs.specs || 'FQDM|凡人修仙传;MXdm|凡人修仙传;AGE|凡人修仙传;fcdm|凡人修仙传;7sefun|凡人修仙传;dmghg1|凡人修仙传;blbl|凡人修仙传;lblb|凡人修仙传' }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          emulator-boot-timeout: 900
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: timeout 1500 bash tool/ci_emulator_e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-out
          path: e2e-out/
          retention-days: 7
