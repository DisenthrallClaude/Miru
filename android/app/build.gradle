plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "io.github.disenthrallclaude.miru"
    compileSdk flutter.compileSdkVersion
    // 不安装真实 NDK: 本项目所有原生依赖(media_kit 等)均使用预编译 so,
    // 无任何 CMake/ndk-build 编译任务;NDK 唯一可能的用途(符号剥离)已被
    // 下方 packaging.keepDebugSymbols 跳过。显式钉住 AGP 默认版本号,
    // 与 SDK 内的占位标记目录对应,阻断 Gradle/AGP 自动下载 2GB+ 的 NDK
    // (受限磁盘环境无法容纳)。
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 引擎与插件(media_kit 等)发布版 so 均已在上游剥离符号;
    // 显式跳过剥离任务,构建即完全不依赖 NDK 工具链。
    // (受限磁盘环境无法安装 2.4GB 的 NDK)
    packaging {
        jniLibs {
            keepDebugSymbols += '**/*.so'
            // shared_preferences_android 传递依赖的 androidx.datastore 1.1.x
            // 会带全 ABI 的 shared_counter so(约 10KB),与本包 arm64 单架构
            // 定位不符,打包阶段剔除(defaultConfig 的 abiFilters 管不到它)。
            excludes += ['**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**']
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Miru 独立命名空间，与上游 Kazumi 彻底脱钩，避免安装冲突。
        applicationId "io.github.disenthrallclaude.miru"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // 只打包 arm64-v8a: 本项目只发 arm64 单架构 APK(README 已注明)。
        // 插件传递依赖(如 androidx.datastore 的 shared_counter)会带全 ABI
        // 的 so,不钉死会把 armeabi-v7a/x86_64 碎文件混进包里。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            keyAlias 'miru'
            keyPassword 'Miru2026ReleaseSign'
            storeFile file('miru-release.keystore')
            storePassword 'Miru2026ReleaseSign'
        }
    }

    buildTypes {
        release {
            // 固定发布签名:密钥库已提交进仓库(android/app/miru-release.keystore),
            // 任何环境检出后都能构建出同签名 APK,保障老用户免卸载直接覆盖升级
            // (沙盒重置/换机后签名不丢失)。密钥随公开仓库分发是个人项目的
            // 有意权衡——风险仅为他人可用同签名覆盖安装,不影响功能。
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
