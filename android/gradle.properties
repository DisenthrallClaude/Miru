org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
# 内存记账（总内存 3.9G，2 核）：
# Gradle 主 daemon 上限 1.5G；Kotlin 编译 daemon 单独限 640M；
# 禁并行与多 worker，避免两个编译 daemon 同时驻留把 OOM 触发在 dex 阶段。
kotlin.daemon.jvmargs=-Xmx640m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
android.useAndroidX=true
# Jetifier 关闭: 所有依赖均为 AndroidX 原生,无需转换;开启会使 transforms 缓存翻倍
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
